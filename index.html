#tdv5{font-family:system-ui,-apple-system,sans-serif;background:#20263e;color:white;border-radius:15px;padding:10px;max-width:450px;margin:auto;overflow:hidden;box-sizing:border-box}

,276],[77,276],[77,202],[278,202],[278,119],[149,119],[149,57],[316,57]];const SP=[[66,301],[163,369],[326,315],[178,237],[28,238],[235,158],[329,162],[91,138],[210,78],[73,75]];const kinds={ice:{ico:'❄️',cost:20,range:91,dps:5.5,slow:.85},sound:{ico:'🔊',cost:30,range:110,dps:5,slow:1},mud:{ico:'🟤',cost:25,range:40,dps:3,slow:.53},box:{ico:'🎁',cost:15,range:42,dmg:20,slow:1}};let lens=[],total=0;for(let i=1;i<P.length;i++){let d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);lens.push(d);total+=d}let selected='ice',money,gauge,dist,t,started,paused,ended,won,speed,prev=0,angryUntil,talkTime,clearTime,towers=[];
function pos(d){for(let i=1;i<P.length;i++){const l=lens[i-1];if(d<=l){let r=d/l,a=P[i-1],b=P[i];return[a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r]}d-=l}return P[P.length-1]}
function say(s){Q('say').textContent=s;talkTime=t}function info(s){Q('note').textContent=s}
function drawFrame(c,index,w,hgt){c.clearRect(0,0,w,hgt);if(sheet.complete&&sheet.naturalWidth){c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(sheet,index*80,0,80,80,0,0,w,hgt)}else{c.font='37px sans-serif';c.textAlign='center';c.fillText(index>=8?'😢':'🧙‍♀️',w/2,hgt*.75)}}
function render(){const [x,y]=pos(dist);h.style.left=(x/360*100)+'%';h.style.top=(y/390*100)+'%';let frame=ended&&won?8+Math.min(3,Math.floor(clearTime*5)):Math.floor(t*(gauge>75?4:gauge>50?6:9))%4;drawFrame(hc,frame,52,71);let face=ended&&won?7:gauge<22?7:gauge<46?6:t<angryUntil?5:4;drawFrame(fc,face,73,78);Q('cash').textContent=Math.floor(money);Q('remain').textContent=Math.max(0,Math.ceil(100*(1-dist/total)))+'%';Q('gval').textContent=Math.ceil(gauge)+'%';Q('fill').style.width=Math.max(0,gauge)+'%'}
function reset(){money=90;gauge=100;dist=0;t=0;started=false;paused=false;ended=false;won=false;speed=1;angryUntil=0;talkTime=0;clearTime=0;towers=[];Q('start').textContent='▶ 開始';Q('pause').textContent='⏸ 停止';Q('speed').textContent='⏩ 1倍速';Q('speedtag').textContent='×1';Q('banner').style.display='none';Q('puddle').style.display='none';R.querySelectorAll('.plot').forEach(b=>{b.classList.remove('used');b.textContent='+'});say('トイレに行かせてよ……！');info('▶ 開始して光る「＋」をタップ！');render()}
function finish(success){ended=true;won=success;started=false;Q('start').textContent='▶ もう一度';Q('banner').style.display='block';Q('banner').textContent=success?'🎉 GAME CLEAR!':'🚻 GAME OVER';if(success){gauge=0;say('ううっ……もう動けないよぉ……！');info('我慢ゲージ0%！ クリア！')}else{say('やったぁ！ 間に合ったぁ！');info('トイレに到達されちゃった！')}render()}
SP.forEach(([x,y],i)=>{let b=document.createElement('button');b.className='plot';b.type='button';b.textContent='+';b.style.left=x/360*100+'%';b.style.top=y/390*100+'%';b.addEventListener('click',()=>{if(!started||paused){info('まず ▶ 開始！ を押してね');return}if(towers.some(z=>z.i===i)){info('ここにはもう設置済み！');return}let u=kinds[selected];if(money<u.cost){info('コストが足りないよ！');return}money-=u.cost;towers.push({i,x,y,type:selected,used:false});b.classList.add('used');b.textContent=u.ico;angryUntil=t+2;say('ちょっと！ そこに置かないでよ！');info(u.ico+' 設置したよ！');render()});Q('field').appendChild(b)});
R.querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.unit;R.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('active',x===b));info(kinds[selected].ico+' 選択中！ 光る＋をタップ')}));Q('start').addEventListener('click',()=>{if(started)return;reset();started=true;Q('start').textContent='プレイ中';say('何があってもトイレまで行くからね！');info('ユニット選択 → 「＋」に設置！')});Q('pause').addEventListener('click',()=>{if(!started)return;paused=!paused;Q('pause').textContent=paused?'▶ 再開':'⏸ 停止';info(paused?'一時停止中':'再開！')});Q('speed').addEventListener('click',()=>{speed=speed===1?1.5:speed===1.5?2:1;Q('speed').textContent='⏩ '+speed+'倍速';Q('speedtag').textContent='×'+speed});Q('reset').addEventListener('click',reset);
function step(dt){t+=dt;money=Math.min(100,money+dt*6);let [x,y]=pos(dist),slow=1,damage=.25*dt;for(const z of towers){let u=kinds[z.type];if(Math.hypot(x-z.x,y-z.y)>u.range)continue;if(z.type==='box'){if(!z.used){z.used=true;damage+=u.dmg;angryUntil=t+2;say('ひゃっ！？ な、何するの！？')}}else{damage+=u.dps*dt;slow=Math.min(slow,u.slow)}}gauge=Math.max(0,gauge-damage);if(gauge<=0){finish(true);return}const haste=gauge<=25?1.9:gauge<=50?1.55:gauge<=75?1.2:1;dist=Math.min(total,dist+31*dt*haste*slow);if(dist>=total){finish(false);return}if(t-talkTime>4.5)say(gauge<25?'もう無理！ そこをどいてぇ！':gauge<55?'急がなきゃ……！ ほんとにまずい！':'だから邪魔しないでってば！')}
function tick(ts){if(!prev)prev=ts;let dt=Math.min(.06,(ts-prev)/1000);prev=ts;if(started&&!paused)step(dt*speed);if(ended&&won){clearTime=Math.min(1,clearTime+dt);let [x,y]=pos(dist),p=Q('puddle');p.style.display='block';p.style.left=(x/360*100)+'%';p.style.top=((y+9)/390*100)+'%'}render();requestAnimationFrame(tick)}sheet.onload=render;reset();requestAnimationFrame(tick)})();
